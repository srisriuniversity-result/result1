<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sri Sri University</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:Arial, sans-serif;

      /* Background Image */
      background:url('sri-sri-logo.jpg') no-repeat center center/cover;
      position:relative;
    }

    /* Dark overlay */
    body::before{
      content:'';
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.55);
    }

    .content{
      position:relative;
      z-index:2;
      text-align:center;
      color:white;
    }

    .content h1{
      font-size:60px;
      margin-bottom:15px;
    }

    .content p{
      font-size:22px;
      letter-spacing:1px;
    }

    button{
      margin-top:25px;
      padding:12px 28px;
      border:none;
      border-radius:10px;
      background:#ffcc00;
      color:black;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:white;
      transform:scale(1.05);
    }
  </style>
</head>

<body>

  <div class="content">
    <h1>Sri Sri University</h1>
    <p>Welcome to My GitHub Website</p>

    <button onclick="alert('Welcome to Sri Sri University')">
      Explore
    </button>
  </div>

</body>
</html>
